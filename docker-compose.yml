services:
  db:
    image: pgvector/pgvector:pg16
    container_name: maintidoc-db
    environment:
      POSTGRES_USER: ${PG_USER:-maintidoc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-maintidoc}
      POSTGRES_DB: ${PG_DB:-maintidoc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-maintidoc}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
