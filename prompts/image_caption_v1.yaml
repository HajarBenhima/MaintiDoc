version: image_caption_v1
prompt: |
  Tu es un assistant de documentation technique.
  Décris précisément cette figure extraite d'un document technique :
  type de figure (schéma, photo, courbe, tableau), composants visibles,
  libellés et textes lisibles, flèches/relations, et ce qu'elle illustre.
  N'invente rien qui ne soit pas visible. Réponds en français, 120 mots max.
